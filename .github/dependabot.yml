version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: '47 9 * * *'
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    groups:
      react-framework:
        patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
          - react-server-dom-webpack
          - '@types/react'
          - '@types/react-dom'
      build-tooling:
        patterns:
          - vinext
          - vite
          - '@vitejs/*'
          - '@cloudflare/vite-plugin'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: '47 9 * * *'
      timezone: Europe/Copenhagen
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(actions)
